name: Publish Snap Store package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag, for example v1.1.24"
        required: true
        type: string
      channel:
        description: "Snap Store release channel"
        required: true
        type: choice
        options:
          - candidate
          - stable
        default: candidate

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Snap assets for selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.snap' --dir release
          test "$(find release -maxdepth 1 -name '*.snap' | wc -l)" -eq 2

      - name: Verify Snap package identity and architectures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          : > "$RUNNER_TEMP/snap-yaml"
          for f in release/*.snap; do
            yaml="$(unsquashfs -cat "$f" meta/snap.yaml)"
            name="$(printf '%s\n' "$yaml" | awk '$1 == "name:" { print $2; exit }')"
            test "$name" = "kaalkey-authenticator" || {
              echo "Unexpected Snap package name '$name' in $f"
              exit 1
            }
            printf '%s\n' "$yaml" >> "$RUNNER_TEMP/snap-yaml"
          done
          grep -q 'amd64' "$RUNNER_TEMP/snap-yaml"
          grep -q 'arm64' "$RUNNER_TEMP/snap-yaml"

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Authenticate with Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$SNAPCRAFT_STORE_CREDENTIALS" || {
            echo "Missing SNAPCRAFT_STORE_CREDENTIALS repository secret"
            exit 1
          }
          printf '%s' "$SNAPCRAFT_STORE_CREDENTIALS" > "$RUNNER_TEMP/snapcraft.assert"
          snapcraft login --with "$RUNNER_TEMP/snapcraft.assert"
          rm -f "$RUNNER_TEMP/snapcraft.assert"

      - name: Upload both architectures to selected channel
        env:
          SNAP_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          for f in release/*.snap; do
            snapcraft upload --release="$SNAP_CHANNEL" "$f"
          done
