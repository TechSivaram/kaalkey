name: Publish Snap Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download latest Snap release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.snap' --dir release
          test -n "$(find release -name '*.snap' -print -quit)"

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Authenticate with Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          test -n "$SNAPCRAFT_STORE_CREDENTIALS" || { echo 'Missing SNAPCRAFT_STORE_CREDENTIALS repository secret'; exit 1; }
          printf '%s' "$SNAPCRAFT_STORE_CREDENTIALS" > "$RUNNER_TEMP/snapcraft.assert"
          snapcraft login --with "$RUNNER_TEMP/snapcraft.assert"
          rm -f "$RUNNER_TEMP/snapcraft.assert"

      - name: Upload to Snap Store
        run: snapcraft upload --release=stable release/*.snap
