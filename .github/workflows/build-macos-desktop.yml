name: KaalKey macOS desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-desktop:
    name: Build macOS ${{ matrix.arch }} DMG and ZIP
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Generate macOS ICNS application icon
        shell: bash
        run: |
          set -Eeuo pipefail
          source_icon="build/icons/1024x1024.png"
          test -s "$source_icon"
          iconset="build/kaalkey.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 "$source_icon" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$source_icon" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$source_icon" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$source_icon" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$source_icon" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$source_icon" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$source_icon" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$source_icon" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$source_icon" --out "$iconset/icon_512x512.png" >/dev/null
          cp "$source_icon" "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o build/kaalkey.icns
          test -s build/kaalkey.icns

      - name: Build native-architecture macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -Eeuo pipefail
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify and label macOS packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release/labelled
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"
          test -s "$dmg"
          test -s "$zip"
          hdiutil verify "$dmg"
          arch="${{ matrix.arch }}"
          cp "$dmg" "release/labelled/kaalkey-macos-${arch}.dmg"
          cp "$zip" "release/labelled/kaalkey-macos-${arch}.zip"
          ls -lh release/labelled

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-macos-${{ matrix.arch }}
          path: release/labelled/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach Intel and Apple Silicon packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download both architecture builds
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-macos-*
          path: release
          merge-multiple: true

      - name: Publish macOS release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/kaalkey-macos-x64.dmg
            release/kaalkey-macos-x64.zip
            release/kaalkey-macos-arm64.dmg
            release/kaalkey-macos-arm64.zip
