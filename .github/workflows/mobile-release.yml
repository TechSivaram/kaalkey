name: Mobile release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 no longer requests the retired "tools" package.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -Eeuo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }

          keystore="$RUNNER_TEMP/kaalkey-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"

          keytool -list -keystore "$keystore" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null

          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/configure-android-release-signing.cjs

      - name: Build signed APK and AAB
        working-directory: android
        shell: bash
        env:
          # Gradle reads these values when the release tasks execute.
          # ANDROID_KEYSTORE_FILE is persisted by the earlier GITHUB_ENV step.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$ANDROID_KEYSTORE_FILE" || { echo "ANDROID_KEYSTORE_FILE is not set"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify Android outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          jarsigner -verify -verbose -certs "$aab" >/dev/null
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          echo "APK and AAB generated; both package signatures verified."
          mkdir -p release
          cp "$apk" release/kaalkey-android.apk
          cp "$aab" release/kaalkey-android.aab

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-android-release
          path: |
            release/kaalkey-android.apk
            release/kaalkey-android.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build unsigned iOS archive and Simulator app
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Generate explicit Xcode application scheme
        id: xcode
        shell: bash
        run: |
          set -Eeuo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$workspace" || { echo "::error::No Xcode workspace found under ios/"; exit 1; }
          test -n "$project" || { echo "::error::No Xcode project found under ios/"; exit 1; }

          project_name="$(basename "$project" .xcodeproj)"
          pbxproj="$project/project.pbxproj"
          test -s "$pbxproj" || { echo "::error::Missing generated project.pbxproj"; exit 1; }

          # Explicitly generate a scheme whose BuildAction includes the actual
          # PBXNativeTarget with the iOS application product type.
          python3 - "$pbxproj" "$project" "$project_name" <<'PY'
          import os, re, sys
          from xml.sax.saxutils import escape

          pbxproj, project_dir, project_name = sys.argv[1:]
          source = open(pbxproj, encoding="utf-8").read()
          targets = []
          pattern = re.compile(
              r'(?m)^\s*([A-F0-9]{24}) /\* (.*?) \*/ = \{\n(.*?)^\s*\};',
              re.S
          )
          for match in pattern.finditer(source):
              uuid, comment, body = match.groups()
              if not re.search(r'\bisa\s*=\s*PBXNativeTarget\s*;', body):
                  continue
              if not re.search(
                  r'productType\s*=\s*"com\.apple\.product-type\.application"\s*;',
                  body
              ):
                  continue
              name_match = re.search(r'\bname\s*=\s*([^;]+);', body)
              product_match = re.search(r'\bproductName\s*=\s*([^;]+);', body)
              target_name = name_match.group(1).strip().strip('"') if name_match else comment
              product_name = product_match.group(1).strip().strip('"') if product_match else target_name
              targets.append((uuid, target_name, product_name))

          if len(targets) != 1:
              print(
                  f"::error::Expected exactly one iOS application target; found {len(targets)}: "
                  f"{[(t[1], t[0]) for t in targets]}",
                  file=sys.stderr
              )
              sys.exit(1)

          uuid, target_name, product_name = targets[0]
          scheme_name = "KaalKeyCI"
          scheme_dir = os.path.join(project_dir, "xcshareddata", "xcschemes")
          os.makedirs(scheme_dir, exist_ok=True)
          project_ref = escape(f"container:{project_name}.xcodeproj")
          xml = f"""<?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="{uuid}" BuildableName="{escape(product_name)}.app" BlueprintName="{escape(target_name)}" ReferencedContainer="{project_ref}"/>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgs="YES"/>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES"/>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgs="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES"/>
             <AnalyzeAction buildConfiguration="Debug"/>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="NO"/>
          </Scheme>
          """
          scheme_path = os.path.join(scheme_dir, scheme_name + ".xcscheme")
          with open(scheme_path, "w", encoding="utf-8") as f:
              f.write(xml)
          print(f"Generated {scheme_name} for iOS app target {target_name} ({uuid})")
          PY

          scheme="KaalKeyCI"
          xcodebuild -list -json -workspace "$workspace" > "$RUNNER_TEMP/xcode-list.json"
          python3 - "$RUNNER_TEMP/xcode-list.json" "$scheme" <<'PY'
          import json, sys
          schemes = json.load(open(sys.argv[1])).get("workspace", {}).get("schemes", [])
          if sys.argv[2] not in schemes:
              print(f"::error::Generated scheme {sys.argv[2]} is not visible in workspace. Schemes: {schemes}")
              sys.exit(1)
          print("Workspace recognizes generated scheme:", sys.argv[2])
          PY

          xcodebuild -showBuildSettings \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            > "$RUNNER_TEMP/kaalkey-ios-build-settings.txt"
          grep -q 'PRODUCT_TYPE = com.apple.product-type.application' \
            "$RUNNER_TEMP/kaalkey-ios-build-settings.txt" || {
              echo "::error::Generated CI scheme does not expose an iOS application target."
              grep -E '(^| )PRODUCT_TYPE =|FULL_PRODUCT_NAME =|TARGET_NAME =' \
                "$RUNNER_TEMP/kaalkey-ios-build-settings.txt" || true
              exit 1
            }

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "project_name=$project_name" >> "$GITHUB_OUTPUT"
          echo "Using explicit application scheme: $scheme"
      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release
          derived_data="$RUNNER_TEMP/kaalkey-ios-simulator"
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            build

          products="$derived_data/Build/Products"
          echo "Xcode build products directory:"
          if [ -d "$products" ]; then
            find -L "$products" -maxdepth 5 -print | sed -n '1,250p'
          else
            echo "Build/Products directory was not created."
          fi

          expected_bundle_id="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["ios"]["bundleIdentifier"])')"
          test -n "$expected_bundle_id"
          echo "Expected iOS bundle identifier: $expected_bundle_id"
          app=""
          while IFS= read -r candidate; do
            candidate_bundle_id=$(/usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' "$candidate/Info.plist" 2>/dev/null || true)
            echo "Found app candidate: $candidate (bundle: ${candidate_bundle_id:-unknown})"
            if [ "$candidate_bundle_id" = "$expected_bundle_id" ]; then
              app="$candidate"
              break
            fi
          done < <(find -L "$derived_data" -type d -name '*.app' -print)

          if [ -z "$app" ]; then
            echo "::error::The selected Xcode application scheme built successfully, but the expected app bundle '$expected_bundle_id' was not found."
            echo "Build settings relevant to product output:"
            grep -E ' (BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR|FULL_PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_TYPE) =' \
              "$RUNNER_TEMP/kaalkey-ios-build-settings.txt" || true
            exit 1
          fi

          echo "Packaging Simulator app: $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" release/kaalkey-ios-simulator.app.zip
          test -s release/kaalkey-ios-simulator.app.zip

      - name: Create unsigned iOS XCArchive
        run: |
          set -Eeuo pipefail
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/release/kaalkey-ios.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test -d release/kaalkey-ios.xcarchive
          ditto -c -k --sequesterRsrc --keepParent \
            release/kaalkey-ios.xcarchive \
            release/kaalkey-ios.xcarchive.zip

      - name: Upload iOS archive and Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-ios-unsigned-builds
          path: |
            release/kaalkey-ios.xcarchive.zip
            release/kaalkey-ios-simulator.app.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach mobile packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download mobile build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*
          path: release
          merge-multiple: true

      - name: Publish mobile release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/kaalkey-android.apk
            release/kaalkey-android.aab
            release/kaalkey-ios.xcarchive.zip
            release/kaalkey-ios-simulator.app.zip
