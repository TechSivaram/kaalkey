name: Build KaalKey Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows EXE and MSI installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:win

      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe -File
          $msi = Get-ChildItem release -Filter *.msi -File
          if ($exe.Count -lt 1) { throw "No EXE installer was generated." }
          if ($msi.Count -lt 1) { throw "No MSI installer was generated." }
          $exe | ForEach-Object { Write-Host "EXE: $($_.Name) ($($_.Length) bytes)" }
          $msi | ForEach-Object { Write-Host "MSI: $($_.Name) ($($_.Length) bytes)" }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-windows-installers
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach Windows EXE and MSI installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: kaalkey-windows-installers
          path: release

      - name: Publish Windows installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
