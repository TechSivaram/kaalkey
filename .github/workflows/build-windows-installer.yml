name: Build KaalKey Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaalKey-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
