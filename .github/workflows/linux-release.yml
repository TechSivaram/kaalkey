name: Linux release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build DEB, RPM and AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Build DEB, RPM and AppImage
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Integrate Debian AppStream metadata
        run: node scripts/fix-linux-packages.cjs

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-linux-packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error

  build-snap:
    name: Build Snap locally using Snapcraft container
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/canonical/snapcraft:8_core24
      # The image's default entrypoint is the snapcraft CLI; GitHub Actions
      # needs a normal shell to execute checkout, setup-node, npm, and build steps.
      options: --entrypoint ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Verify local Snap build configuration
        run: |
          snapcraft --version
          node -e "const b=require('./package.json').build.snapcraft; if (b.core24?.useDestructiveMode !== true) process.exit(1); if (b.core24?.remoteBuild) process.exit(2); console.log('Local destructive-mode Snap build enabled; remote build disabled.')"

      - name: Build Snap locally
        run: npx electron-builder --linux snap --publish never

      - name: Upload Snap package
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-snap-package
          path: release/*.snap
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-snap
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.snap

  collect-manual-artifacts:
    name: Collect packages for manual workflow run
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build-linux
      - build-snap
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Upload combined package bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-all-linux-packages
          path: release/*
          if-no-files-found: error
