name: Linux release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build DEB, RPM and AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Build DEB, RPM and AppImage
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Integrate Debian AppStream metadata
        run: node scripts/fix-linux-packages.cjs

      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Verify package architecture
        run: |
          set -euo pipefail
          expected_deb="${{ matrix.arch }}"
          expected_rpm="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          for f in release/*.deb; do
            actual="$(dpkg-deb -f "$f" Architecture)"
            test "$actual" = "$expected_deb"
          done
          for f in release/*.rpm; do
            actual="$(rpm -qp --qf '%{ARCH}' "$f")"
            test "$actual" = "$expected_rpm"
          done
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-linux-packages-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error

  build-snap:
    name: Build Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Snapcraft, LXD and Snap inspection tools
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

          sudo snap install snapcraft --classic
          sudo snap install lxd

          echo "=== Start LXD service ==="
          sudo snap start lxd.daemon

          echo "=== Wait for LXD daemon ==="
          sudo lxd waitready --timeout=120

          echo "=== Initialize LXD ==="
          sudo lxd init --auto

          echo "=== Add runner to the LXD group ==="
          sudo usermod --append --groups lxd "$USER"

          echo "=== Configure Snapcraft to use LXD ==="
          sudo snap set snapcraft provider=lxd

          echo "=== Verify Snapcraft provider ==="
          provider="$(sudo snap get snapcraft provider)"
          echo "Snapcraft provider: $provider"
          test "$provider" = "lxd"

          echo "=== Verify LXD is ready ==="
          sudo lxc info

          echo "=== Configure LXD bridge DNS forwarding ==="
          if sudo lxc network show lxdbr0 >/dev/null 2>&1; then
            # dns.nameservers is not a supported LXD bridge option.
            # raw.dnsmasq supplies upstream resolvers to the bridge DNS proxy.
            sudo lxc network set lxdbr0 dns.mode managed
            dnsmasq_config="$(printf 'server=1.1.1.1\nserver=8.8.8.8')"
            sudo lxc network set lxdbr0 raw.dnsmasq "$dnsmasq_config"

            echo "=== Ensure IPv4 forwarding and bridge NAT are enabled ==="
            sudo sysctl -w net.ipv4.ip_forward=1
            sudo lxc network set lxdbr0 ipv4.nat true
            sudo lxc network set lxdbr0 ipv4.routing true
            sudo lxc network set lxdbr0 ipv4.firewall true
            sudo lxc network show lxdbr0
          else
            echo "ERROR: lxdbr0 was not created by lxd init --auto"
            sudo lxc network list
            exit 1
          fi

      - name: Verify LXD container networking
        run: |
          set -euxo pipefail

          test_name="kaalkey-lxd-network-test"
          cleanup_lxd_test() {
            sudo lxc delete "$test_name" --force >/dev/null 2>&1 || true
          }
          trap cleanup_lxd_test EXIT

          echo "=== Launch Ubuntu 24.04 test container ==="
          sudo lxc launch ubuntu:24.04 "$test_name"

          echo "=== Wait for container network configuration ==="
          for attempt in $(seq 1 30); do
            if sudo lxc exec "$test_name" -- getent hosts snapcraft.io; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "DNS lookup failed after 30 attempts"
              echo "=== Container resolv.conf ==="
              sudo lxc exec "$test_name" -- cat /etc/resolv.conf || true
              echo "=== Container routes ==="
              sudo lxc exec "$test_name" -- ip route || true
              echo "=== LXD bridge configuration ==="
              sudo lxc network show lxdbr0 || true
              exit 1
            fi
            sleep 2
          done

          echo "=== Verify IPv4 HTTPS connectivity ==="
          # Force IPv4: this runner's LXD guest has no usable IPv6 route.
          if ! sudo lxc exec "$test_name" -- python3 -c 'import socket,ssl; host="snapcraft.io"; ip=socket.getaddrinfo(host,443,socket.AF_INET,socket.SOCK_STREAM)[0][4][0]; print("Testing IPv4:",ip,flush=True); raw=socket.create_connection((ip,443),timeout=20); conn=ssl.create_default_context().wrap_socket(raw,server_hostname=host); conn.sendall(b"HEAD / HTTP/1.1\r\nHost: snapcraft.io\r\nConnection: close\r\n\r\n"); print("IPv4 HTTPS response:",conn.recv(128).splitlines()[0].decode()); conn.close()'; then
            echo "ERROR: LXD guest cannot reach snapcraft.io over IPv4. Collecting network diagnostics."
            echo "=== Host IPv4 forwarding ==="
            sysctl net.ipv4.ip_forward || true
            echo "=== Host default route ==="
            ip -4 route || true
            echo "=== Host route to Snapcraft ==="
            ip -4 route get 185.125.190.21 || true
            echo "=== Container IPv4 addresses ==="
            sudo lxc exec "$test_name" -- ip -4 addr || true
            echo "=== Container IPv4 routes ==="
            sudo lxc exec "$test_name" -- ip -4 route || true
            echo "=== LXD bridge configuration ==="
            sudo lxc network show lxdbr0 || true
            echo "=== NAT and forwarding rules ==="
            sudo nft list ruleset || true
            exit 1
          fi

          cleanup_lxd_test
          trap - EXIT

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Verify Core24 GNOME/LXD build configuration
        run: |
          snapcraft --version
          printf 'Snapcraft provider: '
          provider="$(sudo snap get snapcraft provider)"
          echo "$provider"
          test "$provider" = "lxd"
          node -e "const b=require('./package.json').build.snapcraft; if (b.base !== 'core24') throw Error('Snap base must be core24'); if (b.core24?.useDestructiveMode === true) throw Error('Destructive mode disables the GNOME extension'); if (b.core24?.useLXD !== true) throw Error('useLXD must be true'); if (b.core24?.useMultipass === true) throw Error('useMultipass must be false'); if (b.core24?.remoteBuild) throw Error('remoteBuild must be disabled'); console.log('Verified: Core24 GNOME extension with LXD.')"

      - name: Build Snap with LXD
        run: sg lxd -c 'SNAPCRAFT_BUILD_ENVIRONMENT=lxd node scripts/build-snap.cjs --publish never'

      - name: Verify Snap has exactly one desktop launcher
        run: |
          set -euo pipefail
          snap_file="$(find release -maxdepth 1 -name '*.snap' -print -quit)"
          test -n "$snap_file"
          mapfile -t desktop_files < <(
            unsquashfs -ll "$snap_file" |
              awk '{print $NF}' |
              grep -E '(^|/)meta/gui/[^/]+\.desktop$' || true
          )
          printf 'Desktop launchers found: %s\n' "${#desktop_files[@]}"
          printf '%s\n' "${desktop_files[@]}"
          test "${#desktop_files[@]}" -eq 1
          expected="meta/gui/$(node -p "require('./package.json').build.appId").desktop"
          actual="${desktop_files[0]#squashfs-root/}"
          test "$actual" = "$expected"

      - name: Upload Snap package
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-snap-package-${{ matrix.arch }}
          path: release/*.snap
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-snap]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.snap

  collect-manual-artifacts:
    name: Collect packages for manual workflow run
    if: github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-snap]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Upload combined package bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-all-linux-packages
          path: release/*
          if-no-files-found: error
