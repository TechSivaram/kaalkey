name: Linux release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    # Canonical Snapcraft 8 image includes the Snapcraft CLI; avoids installing
    # Snapcraft from the Snap Store on the GitHub-hosted runner.
    container:
      image: ghcr.io/canonical/snapcraft:8_core24
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        run: apt-get update && apt-get install -y --no-install-recommends rpm xz-utils

      - name: Verify Snapcraft
        run: snapcraft --version

      - name: Export web application
        run: npm run desktop:export

      - name: Build Linux packages
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: npx electron-builder --linux AppImage deb rpm snap --publish never

      - name: Integrate Debian AppStream metadata
        run: node scripts/fix-linux-packages.cjs

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.snap

      - name: Upload packages for manual workflow runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-linux-packages
          path: release/*
          if-no-files-found: error
