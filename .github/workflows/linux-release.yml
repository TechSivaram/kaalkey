name: Linux release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build DEB, RPM and AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Build DEB, RPM and AppImage
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Integrate Debian AppStream metadata
        run: node scripts/fix-linux-packages.cjs

      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Verify package architecture
        run: |
          set -euo pipefail
          expected_deb="${{ matrix.arch }}"
          expected_rpm="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          for f in release/*.deb; do
            actual="$(dpkg-deb -f "$f" Architecture)"
            test "$actual" = "$expected_deb"
          done
          for f in release/*.rpm; do
            actual="$(rpm -qp --qf '%{ARCH}' "$f")"
            test "$actual" = "$expected_rpm"
          done
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-linux-packages-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error

  build-snap:
    name: Build Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Snapcraft and LXD
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd waitready --timeout=60
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Verify Core24 GNOME/LXD build configuration
        run: |
          snapcraft --version
          node -e "const b=require('./package.json').build.snapcraft; if (b.core24?.useDestructiveMode === true) throw Error('Destructive mode disables the GNOME extension'); if (b.core24?.useLXD !== true) throw Error('useLXD must be true'); if (b.core24?.remoteBuild) throw Error('remoteBuild must be disabled'); console.log('Verified: Core24 GNOME extension with LXD.')"

      - name: Build Snap with LXD
        run: sg lxd -c 'node scripts/build-snap.cjs --publish never'

      - name: Upload Snap package
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-snap-package-${{ matrix.arch }}
          path: release/*.snap
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-snap]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.snap

  collect-manual-artifacts:
    name: Collect packages for manual workflow run
    if: github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-snap]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Upload combined package bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-all-linux-packages
          path: release/*
          if-no-files-found: error
