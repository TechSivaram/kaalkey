name: Linux release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build DEB, RPM and AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Build DEB, RPM and AppImage
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Integrate Debian AppStream metadata
        run: node scripts/fix-linux-packages.cjs

      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Verify package architecture
        run: |
          set -euo pipefail
          expected_deb="${{ matrix.arch }}"
          expected_rpm="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}"
          for f in release/*.deb; do
            actual="$(dpkg-deb -f "$f" Architecture)"
            test "$actual" = "$expected_deb"
          done
          for f in release/*.rpm; do
            actual="$(rpm -qp --qf '%{ARCH}' "$f")"
            test "$actual" = "$expected_rpm"
          done
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-linux-packages-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error

  build-snap:
    name: Build Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Snapcraft, LXD and Snap inspection tools
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

          sudo snap install snapcraft --classic
          sudo snap install lxd

          sudo snap start lxd.daemon
          sudo lxd waitready --timeout=120
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo snap set snapcraft provider=lxd
          provider="$(sudo snap get snapcraft provider)"
          test "$provider" = "lxd"
          sudo lxc info
          if ! sudo lxc network show lxdbr0; then
            sudo lxc network list
            exit 1
          fi

          # Keep LXD's default managed DNS, DHCP, routing and NAT settings.
          # Do not hard-code public DNS resolvers: GitHub-hosted runners may
          # restrict direct DNS traffic to external resolvers.
          sudo lxc network get lxdbr0 dns.mode
          sudo lxc network get lxdbr0 ipv4.address
          sudo lxc network get lxdbr0 ipv4.nat
          sudo lxc network get lxdbr0 ipv4.routing

          uplink_if="$(ip -4 route show default | awk 'NR==1 {print $5}')"
          if [ -z "$uplink_if" ]; then
            ip -4 route
            exit 1
          fi

          # Docker may set the iptables FORWARD chain policy to DROP.
          # LXD's separate nftables accept rules do not override a DROP in
          # another base chain, so explicitly allow LXD bridge forwarding.
          sudo iptables -C FORWARD -i lxdbr0 -o "$uplink_if" -j ACCEPT 2>/dev/null ||
            sudo iptables -I FORWARD 1 -i lxdbr0 -o "$uplink_if" -j ACCEPT

          sudo iptables -C FORWARD -i "$uplink_if" -o lxdbr0 \
            -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null ||
            sudo iptables -I FORWARD 1 -i "$uplink_if" -o lxdbr0 \
              -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

          sudo iptables -S FORWARD

      - name: Verify LXD container networking
        run: |
          set -Eeuo pipefail

          test_name="kaalkey-lxd-network-test"
          cleanup_lxd_test() {
            sudo lxc delete "$test_name" --force >/dev/null 2>&1 || true
          }
          collect_network_diagnostics() {
            ip -4 route || true
            sysctl net.ipv4.ip_forward || true
            sudo lxc network show lxdbr0 || true
            sudo lxc exec "$test_name" -- ip -4 addr || true
            sudo lxc exec "$test_name" -- ip -4 route || true
            sudo lxc exec "$test_name" -- cat /etc/resolv.conf || true
            sudo journalctl -u snap.lxd.daemon --no-pager -n 100 || true
            sudo nft list ruleset || true
          }
          trap cleanup_lxd_test EXIT

          curl -4 --fail --silent --show-error --head --max-time 20 https://snapcraft.io
          sudo lxc launch ubuntu:24.04 "$test_name"

          dns_ready=false
          for attempt in $(seq 1 30); do
            if sudo lxc exec "$test_name" -- getent ahostsv4 snapcraft.io; then
              dns_ready=true
              break
            fi
            sleep 2
          done

          if [ "$dns_ready" != true ]; then
            collect_network_diagnostics
            exit 1
          fi

          if ! sudo lxc exec "$test_name" -- apt-get -o Acquire::ForceIPv4=true update; then
            collect_network_diagnostics
            exit 1
          fi

          if ! sudo lxc exec "$test_name" -- \
            env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends curl ca-certificates; then
            collect_network_diagnostics
            exit 1
          fi

          if ! sudo lxc exec "$test_name" -- \
            curl -4 --fail --silent --show-error --head --location --max-time 30 https://snapcraft.io; then
            collect_network_diagnostics
            exit 1
          fi

          cleanup_lxd_test
          trap - EXIT

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Verify Core24 GNOME/LXD build configuration
        run: |
          snapcraft --version
          provider="$(sudo snap get snapcraft provider)"
          test "$provider" = "lxd"
          node -e "const b=require('./package.json').build.snapcraft; if (b.base !== 'core24') throw Error('Snap base must be core24'); if (b.core24?.useDestructiveMode === true) throw Error('Destructive mode disables the GNOME extension'); if (b.core24?.useLXD !== true) throw Error('useLXD must be true'); if (b.core24?.useMultipass === true) throw Error('useMultipass must be false'); if (b.core24?.remoteBuild) throw Error('remoteBuild must be disabled');"

      - name: Build Snap with LXD
        run: sg lxd -c 'SNAPCRAFT_BUILD_ENVIRONMENT=lxd node scripts/build-snap.cjs --publish never'

      - name: Verify Snap has exactly one desktop launcher
        run: |
          set -euo pipefail
          snap_file="$(find release -maxdepth 1 -name '*.snap' -print -quit)"
          test -n "$snap_file"
          mapfile -t desktop_files < <(
            unsquashfs -ll "$snap_file" |
              awk '{print $NF}' |
              grep -E '(^|/)meta/gui/[^/]+\.desktop$' || true
          )
          printf 'Desktop launchers found: %s\n' "${#desktop_files[@]}"
          printf '%s\n' "${desktop_files[@]}"
          test "${#desktop_files[@]}" -eq 1
          expected="meta/gui/$(node -p "require('./package.json').build.appId").desktop"
          actual="${desktop_files[0]#squashfs-root/}"
          test "$actual" = "$expected"

      - name: Upload Snap package
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-snap-package-${{ matrix.arch }}
          path: release/*.snap
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Flatpak build and validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder appstream xvfb dbus-daemon
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          appstreamcli --version
          flatpak --version

      - name: Install dependencies
        run: npm ci

      - name: Export web application
        run: npm run desktop:export

      - name: Build Flatpak bundle
        shell: bash
        env:
          # electron-builder 26.18.0 uses this debug namespace for Flatpak bundling.
          DEBUG: "@malept/flatpak-bundler"
        run: |
          set -Eeuo pipefail
          npx electron-builder --linux flatpak --publish never 2>&1 | tee flatpak-debug.log

      - name: Upload Flatpak debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-debug-log-${{ matrix.arch }}
          path: flatpak-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate AppStream metadata
        run: |
          set -euo pipefail
          appstreamcli validate build/linux/metainfo/com.techsivaram.kaalkey.metainfo.xml

      - name: Verify and install Flatpak bundle
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
        run: |
          set -Eeuo pipefail

          app_id="com.techsivaram.kaalkey"

          echo "=== Locate Flatpak bundle ==="
          test -d release
          mapfile -t flatpak_files < <(
            find release -maxdepth 1 -type f -name '*.flatpak' -print
          )
          if [[ "${#flatpak_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one Flatpak bundle; found %s\n' "${#flatpak_files[@]}"
            printf '%s\n' "${flatpak_files[@]}"
            exit 1
          fi

          flatpak_file="${flatpak_files[0]}"
          test -s "$flatpak_file"
          printf 'Bundle: %s\n' "$flatpak_file"

          echo "=== Verify configured application ID ==="
          configured_app_id="$(node -p "require('./package.json').build.appId")"
          if [[ "$configured_app_id" != "$app_id" ]]; then
            printf 'Unexpected package appId: %s (expected %s)\n' "$configured_app_id" "$app_id"
            exit 1
          fi

          echo "=== Install Flatpak bundle ==="
          flatpak install --user --noninteractive --assumeyes --bundle "$flatpak_file"

          echo "=== Verify installed application ==="
          flatpak info --user "$app_id"

          echo "=== Verify architecture ==="
          actual_arch="$(
            flatpak list --user --app --columns=application,arch |
              awk -v id="$app_id" '$1 == id { print $2; found=1 } END { if (!found) exit 1 }'
          )"
          printf 'Expected architecture: %s\nActual architecture: %s\n' "$EXPECTED_ARCH" "$actual_arch"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Flatpak architecture does not match the build matrix."
            exit 1
          fi

          echo "=== Verify runtime and commit ==="
          runtime_ref="$(flatpak info --user --show-runtime "$app_id")"
          commit="$(flatpak info --user --show-commit "$app_id")"
          test -n "$runtime_ref"
          if [[ ! "$commit" =~ ^[[:xdigit:]]{64}$ ]]; then
            printf 'Unexpected Flatpak commit value: %s\n' "$commit"
            exit 1
          fi
          printf 'Runtime: %s\nCommit: %s\n' "$runtime_ref" "$commit"

          echo "=== Verify application metadata ==="
          metadata="$(flatpak info --user --show-metadata "$app_id")"
          # Use fixed-string matching for literal Flatpak INI metadata lines.
          if ! grep -Fqx '[Application]' <<< "$metadata"; then
            echo "Installed Flatpak metadata has no [Application] group."
            printf '%s\n' "$metadata"
            exit 1
          fi
          if ! grep -Fqx "name=$app_id" <<< "$metadata"; then
            echo "Installed Flatpak metadata has an unexpected application name."
            printf '%s\n' "$metadata"
            exit 1
          fi

          echo "=== Run GUI process-survival smoke test ==="
          log_file="$(mktemp)"
          set +e
          timeout --signal=TERM --kill-after=10s 30s dbus-run-session -- xvfb-run -a flatpak run --user "$app_id" >"$log_file" 2>&1
          status=$?
          set -e
          cat "$log_file"

          # The GUI application is expected to remain running until timeout.
          # An early clean exit is not accepted as proof that startup succeeded.
          if [[ "$status" -ne 124 ]]; then
            printf 'Expected the GUI process to remain alive until timeout (124); got exit code %s.\n' "$status"
            exit 1
          fi

          echo "Flatpak install, metadata, architecture and process-survival checks passed."

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-flatpak-${{ matrix.arch }}
          path: release/*.flatpak
          if-no-files-found: error

  publish-release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-snap, build-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.snap
            release/*.flatpak

  collect-manual-artifacts:
    name: Collect packages for manual workflow run
    if: github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-snap, build-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kaalkey-*-*
          path: release
          merge-multiple: true

      - name: Upload combined package bundle
        uses: actions/upload-artifact@v4
        with:
          name: kaalkey-all-linux-packages
          path: release/*
          if-no-files-found: error
