appId: com.techsivaram.kaalkey.authenticator
productName: KaalKey Authenticator
directories:
  output: release
  buildResources: build
files:
  - dist-desktop/**/*
  - electron/**/*
  - package.json
asar: true
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
